name: "India Market — Without Sentiment"

# ─────────────────────────────────────────────────────────────────────────────
# Fires at 8:45 AM IST every weekday (Mon–Fri) = 03:15 UTC
# 30 min early buffer absorbs GitHub cron delay (~15-45 min typical)
# Script auto-waits for NSE market open at 9:15 AM IST internally.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "15 3 * * 1-5"   # 03:15 UTC = 08:45 IST (30 min before 9:15 IST open)

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pass --dry-run flag (no real orders)"
        type: boolean
        default: false

jobs:
  run-india-without-sentiment:
    name: "NSE | Without Sentiment | run_live_volatile.py"
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub Actions hard limit = 6h

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Write Google credentials from secret ────────────────────────────
      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google_credentials.json

      # ── 5. Run strategy ────────────────────────────────────────────────────
      - name: Run Without Sentiment — India
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_SHEET_ID:   ${{ secrets.GOOGLE_SHEET_ID }}
          PYTHONUNBUFFERED:  "1"
        run: |
          cd "Without LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment"
          python run_live_volatile.py \
            --market india \
            --duration 5.5 \
            --picks 40 \
            --dry-run

      # ── 6. Sync results to Google Sheets ───────────────────────────────────
      - name: Sync results → Google Sheets
        if: always()              # Run even if strategy exits with error
        env:
          GOOGLE_SHEET_ID:              ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python sync_results.py --strategy without_sentiment --market india

      # ── 7. Upload logs as GitHub artifact (available for 7 days) ──────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-without-sentiment-logs-${{ github.run_id }}
          path: |
            Without LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment/Indian_log_volatile/*.log
            Without LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment/Indian_log_volatile/*.txt
          retention-days: 7
          if-no-files-found: warn
