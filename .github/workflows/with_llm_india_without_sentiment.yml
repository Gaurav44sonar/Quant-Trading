name: "With LLM — India Without Sentiment"

# ─────────────────────────────────────────────────────────────────────────────
# Triggered by cron-job.org at exact market open time (9:15 AM IST = 3:45 AM UTC)
# LLM layer: Gemini validates each entry/exit using GEMINI_API_KEY_WITHOUT_SENTIMENT
# cron-job.org URL: .../with_llm_india_without_sentiment.yml/dispatches
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:   # cron-job.org triggers this via GitHub API

jobs:
  run-with-llm-india-without-sentiment:
    name: "NSE | With LLM | Without Sentiment | run_live_volatile.py"
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub Actions hard limit = 6h

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Write Google credentials from secret ────────────────────────────
      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google_credentials.json

      # ── 5. Run With LLM Without Sentiment strategy (India) ─────────────────
      - name: Run With LLM Without Sentiment — India
        env:
          ALPACA_API_KEY:                   ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:                ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_SHEET_ID:                  ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY_WITHOUT_SENTIMENT: ${{ secrets.GEMINI_API_KEY_WITHOUT_SENTIMENT }}
          PYTHONUNBUFFERED:                 "1"
        run: |
          cd "With LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment"
          python run_live_volatile.py \
            --market india \
            --duration 5.5 \
            --picks 40 \
            --dry-run

      # ── 6. Sync results -> Google Sheets ───────────────────────────────────
      - name: Sync results -> Google Sheets
        if: always()
        env:
          GOOGLE_SHEET_ID:              ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python sync_results.py --strategy with_llm_without_sentiment --market india

      # ── 7. Upload logs as GitHub artifact (available for 7 days) ───────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: with-llm-india-without-sentiment-logs-${{ github.run_id }}
          path: |
            With LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment/Indian_log_volatile/*.log
            With LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment/Indian_log_volatile/*.txt
          retention-days: 7
          if-no-files-found: warn
