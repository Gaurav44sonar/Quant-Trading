name: "With LLM — US Without Sentiment"

# ─────────────────────────────────────────────────────────────────────────────
# Triggered by cron-job.org at exact market open time (9:30 AM EDT = 13:30 UTC)
# LLM layer: Gemini validates each entry/exit using GEMINI_API_KEY_WITHOUT_SENTIMENT
# cron-job.org URL: .../with_llm_us_without_sentiment.yml/dispatches
# DST Note: Winter EST (Nov-Mar) = 14:30 UTC — update cron-job.org schedule then.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pass --dry-run flag (no real orders)"
        type: boolean
        default: false

jobs:
  run-with-llm-us-without-sentiment:
    name: "NASDAQ | With LLM | Without Sentiment | run_live_volatile.py"
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub Actions hard limit = 6h

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Write Google credentials from secret ────────────────────────────
      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google_credentials.json

      # ── 5. Run With LLM Without Sentiment strategy (US) ────────────────────
      - name: Run With LLM Without Sentiment — US
        env:
          ALPACA_API_KEY:                   ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:                ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_SHEET_ID:                  ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY_WITHOUT_SENTIMENT: ${{ secrets.GEMINI_API_KEY_WITHOUT_SENTIMENT }}
          GEMINI_API_KEY:                   ${{ secrets.GEMINI_API_KEY_WITHOUT_SENTIMENT }}
          PYTHONUNBUFFERED:                 "1"
        run: |
          cd "With LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment"
          python run_live_volatile.py \
            --market us \
            --duration 5.5 \
            --picks 40

      # ── 6. Sync results -> Google Sheets ───────────────────────────────────
      - name: Sync results -> Google Sheets
        if: always()
        env:
          GOOGLE_SHEET_ID:              ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python sync_results.py --strategy with_llm_without_sentiment --market us

      # ── 7. Upload logs as GitHub artifact (available for 7 days) ───────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: with-llm-us-without-sentiment-logs-${{ github.run_id }}
          path: |
            With LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment/live_volatile_results/*.log
            With LLM/Intraday_Cross_Sectional_Mean_Reversion_Without_Sentiment/live_volatile_results/*.txt
          retention-days: 7
          if-no-files-found: warn
